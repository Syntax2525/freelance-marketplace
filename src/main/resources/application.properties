# SERVER CONFIG

server.port=8082
server.error.include-message=always
server.error.include-binding-errors=always

# Static SPA lives in classpath:/static/ (HTML, css/, js/). Optional Thymeleaf routes use /ui.
spring.thymeleaf.check-template-location=false

# Profile images stored on disk; served at /uploads/** (see WebMvcConfig)
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# MySQL + Docker Connection

spring.datasource.url=jdbc:mysql://localhost:3312/freelance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Tyson@2525
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#
## Connection pool (Hikari - default in Spring Boot)
#spring.datasource.hikari.connection-timeout=30000
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=5
#spring.datasource.hikari.idle-timeout=300000
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Schema: users.role_name replaces roles/user_roles; user_skills is a single table with skill_name (no skills table).
# Existing databases may require dropping old tables user_roles, roles, skills or running a manual migration before start.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
