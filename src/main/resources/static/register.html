<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Freelance Application Platform</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand-block">
        <div class="brand-mark">F</div>
        <div>
          <h1>Create Account</h1>
          <p>Join as a freelancer or client.</p>
        </div>
      </div>
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input type="text" id="registerName" placeholder="syntax java" required />
        </div>
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="syntax@gmail.com" required />
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" placeholder="At least 8 characters" minlength="8" required />
        </div>
        <div class="form-group">
          <label for="registerRole">I am registering as</label>
          <select id="registerRole" required>
            <option value="" disabled selected>Select your role</option>
            <option value="freelancer">Freelancer</option>
            <option value="client">Client</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
        <p class="form-note">Already have an account? <a href="index.html">Sign in</a></p>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
